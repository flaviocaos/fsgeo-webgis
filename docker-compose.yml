# Ambiente local completo: PostGIS, Redis, MinIO (S3), API, worker e frontend.
# Uso: cp .env.example .env && docker compose up --build
name: fsgeo-webgis

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql://webgis:${POSTGRES_PASSWORD:-webgis}@db:5432/webgis
  REDIS_URL: redis://redis:6379/0
  AUTH_MODE: ${AUTH_MODE:-local}
  LOCAL_JWT_SECRET: ${LOCAL_JWT_SECRET:-troque-por-um-segredo-longo-e-aleatorio}
  DEV_USER_EMAIL: ${DEV_USER_EMAIL:-dev@fsgeo.com.br}
  DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-troque-esta-senha}
  SUPABASE_URL: ${SUPABASE_URL:-}
  SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
  STORAGE_BACKEND: s3
  S3_BUCKET: webgis
  S3_ENDPOINT_URL: http://minio:9000
  S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-webgis}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-webgis-minio-senha}
  URL_SIGNING_SECRET: ${URL_SIGNING_SECRET:-troque-este-segredo}
  PUBLIC_API_URL: http://localhost:8000
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: webgis
      POSTGRES_USER: webgis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webgis}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webgis -d webgis"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-webgis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-webgis-minio-senha}
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/webgis &&
      mc version enable local/webgis || true"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-webgis}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-webgis-minio-senha}

  api:
    build: ./backend
    command: ["api"]
    environment: *backend-env
    ports: ["8000:8000"]
    volumes: [workdata:/data]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-setup: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 10s
      retries: 20

  worker:
    build: ./backend
    command: ["worker"]
    environment: *backend-env
    volumes: [workdata:/data]
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_AUTH_MODE: ${AUTH_MODE:-local}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SATELLITE_URL: ${SATELLITE_URL:-}
        NEXT_PUBLIC_SATELLITE_ATTRIBUTION: ${SATELLITE_ATTRIBUTION:-}
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
  workdata:
